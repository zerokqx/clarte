services:
  clarte-auth-service:
    image: apps-auth-service:latest
    container_name: clarte-auth-service
    build:
      context: ../..
      dockerfile: apps/auth-service/Dockerfile
    env_file:
      - .env
      - .env.docker
    networks:
      - auth-net
      - default
networks:
  default:
    external: true
    name: clarte-network
  auth-net:
    external: true
    name: clarte-auth-network
