name: clarte

services:
  clarte-auth-service-postgres:
    image: postgres:16-alpine
    container_name: clarte-auth-service-postgres
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - auth-net
volumes:
  postgres_data:
networks:
  auth-net:
    name: clarte-auth-network
