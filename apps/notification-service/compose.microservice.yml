services:
  clarte-notification-service:
    image: zerok1/clarte-notification-service:latest
    container_name: clarte-notification-service
    build:
      context: ../..
      dockerfile: apps/notification-service/Dockerfile
      args:
        - SERVICE_NAME=notification-service
    env_file:
      - .env
      - .env.docker
    networks:
      - default
      - notification-net
networks:
  default:
    external: true
    name: clarte-network
  notification-net:
    external: true
    name: clarte-notification-network
