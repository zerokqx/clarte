syntax = "proto3";

import "google/protobuf/empty.proto";

package todo;

service TodoService {
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse);
  rpc UpdateTodo(UpdateTodoRequest) returns (google.protobuf.Empty);
  rpc GetUserTodos(google.protobuf.Empty) returns (GetUserTodsResponse);
  rpc CompleteTodo(CompleteTodoRequest) returns (google.protobuf.Empty);
  rpc UncompleteTodo(UncompleteTodoRequest) returns (google.protobuf.Empty);
  rpc DeleteTodo(DeleteTodoRequest) returns (google.protobuf.Empty);
}

message TodoResponse {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  bool is_completed = 5;
  string due_date = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreateTodoRequest {
  string title = 1;
  string description = 2;
  string dueDate = 3;
}

message CreateTodoResponse {
  string id = 1;
}

message UpdateTodoRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string due_date = 4;
  optional bool is_completed = 5;
}

message CompleteTodoRequest {
  string id = 1;
}

message UncompleteTodoRequest {
  string id = 1;
}

message DeleteTodoRequest {
  string id = 1;
}

message GetUserTodsResponse {
  repeated TodoResponse todos = 1;
}
