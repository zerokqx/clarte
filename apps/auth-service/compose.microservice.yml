services:
  clarte-api-gateway:
    image: apps-auth-service:latest
    container_name: clarte-auth-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=auth-service
    env_file:
      - .env
      - .env.docker
    ports:
      - "5000:3000"
    networks:
      - default
networks:
  default:
    external: true
    name: clarte-network
