services:
  clarte-api-gateway:
    image: apps-api-gateway:latest
    container_name: clarte-api-gateway
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=api-gateway
    env_file:
      - .env
      - .env.docker
    ports:
      - "5000:3000"
    networks:
      - default
networks:
  default:
    external: true
    name: clarte-network
