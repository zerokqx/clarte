services:
  clarte-notes-service-mongodb:
    image: mongo:latest
    container_name: clarte-notes-service-mongodb
    ports:
      - '${MONGO_PORT}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_ROOT_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    networks:
      - note-net
    restart: always
volumes:
  mongo_data:
networks:
  note-net:
    name: clarte-note-network
