syntax = "proto3";
import "google/protobuf/empty.proto";
package notes;

service NotesService {
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  rpc GetBytes(GetBytesRequest) returns (GetBytesResponse);
  rpc GetNoteById(GetNoteByIdRequest) returns (Note);
  rpc SaveNoteBytes(SaveNoteBytesRequest) returns (google.protobuf.Empty);
  rpc AccessCheck(AccessCheckRequest) returns (AccessCheckResponse);
  rpc GetAllUserNotes(google.protobuf.Empty) returns (GetAllUserNotesResponse);
}

message CreateNoteResponse {
  string id = 1;
}

message AccessCheckRequest {
  string noteId = 1;
}

message AccessCheckResponse {
  bool status = 1;
}

message Note {
  string id = 1;
  string label = 2;
  optional string content = 3;
  repeated string tags = 4;
  optional string parentId = 5;
  repeated string linksTo = 6;
  string type = 7;
  string authorId = 8;
  string createdAt = 9;
  string updatedAt = 10;
  optional bytes bytes = 11;
}

message GetNoteByIdRequest {
  string id = 1;
}

message GetBytesRequest {
  string id = 1;
}

message GetBytesResponse {
  bytes bytes = 1;
}

message CreateNoteRequest {
  string label = 1;
  optional string content = 2;
  repeated string tags = 3;
  optional bytes bytes = 4;
  optional string parentId = 5;
  repeated string linksTo = 6;
  optional string type = 7;
}

message SaveNoteBytesRequest {
  string id = 1;
  bytes bytes = 2;
  optional string content = 3;
}

message GetAllUserNotesResponse {
  repeated Note notes = 1;
}
