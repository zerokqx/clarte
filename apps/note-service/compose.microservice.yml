services:
  clarte-note-service:
    image: apps-note-service:latest
    container_name: clarte-note-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=note-service
    env_file: ".env"
    environment:
      PORT: 3000
      MONGO_HOST: clarte-notes-service-mongodb
      MONGO_PORT: 27017
      S3_ENDPOINT: http://clarte-minio:9000
    networks:
      - default
      - note-db-network

networks:
  default:
    external: true
    name: clarte-network
  note-db-network:
    external: true
    name: clarte-note-db-network
